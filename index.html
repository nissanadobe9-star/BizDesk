<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizDesk – Business Operating System</title>
<meta name="theme-color" content="#0f766e">
<script>
// Apply saved theme BEFORE first paint so a refresh never flashes/reverts
(function(){try{var t=localStorage.getItem('bizdesk_theme');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{brand:{50:'#f0fdfa',100:'#ccfbf1',500:'#14b8a6',600:'#0d9488',700:'#0f766e',900:'#134e4a'}}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
  @layer components{
    .card{@apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl}
    .btn{@apply inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold bg-brand-700 text-white hover:bg-brand-600 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900}
    .btn-ghost{@apply bg-transparent text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800}
    .inp{@apply w-full px-3 py-2 rounded-lg text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500}
    .th{@apply text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap}
    .td{@apply px-4 py-3 text-sm whitespace-nowrap border-t border-slate-100 dark:border-slate-800}
    .badge{@apply inline-block px-2 py-0.5 rounded-full text-xs font-semibold}
  }
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .tab-in{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.tab-in{animation:none}}
  :root{padding-top:env(safe-area-inset-top,0px)}
  #invoice{display:none}
  @media print{
    body>*:not(#invoice){display:none!important}
    #invoice{display:block!important;background:#fff;color:#111}
    html,body{background:#fff!important}
  }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors">

<div class="flex min-h-screen">
  <!-- Sidebar (desktop) -->
  <aside class="hidden lg:flex w-60 shrink-0 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 h-screen">
    <div class="px-5 py-5 flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-brand-700 text-white grid place-items-center font-extrabold">B</div>
      <div><div class="font-extrabold leading-tight">BizDesk</div><div class="text-xs text-slate-500">Business OS</div></div>
    </div>
    <nav id="sideNav" class="flex-1 px-3 space-y-1"></nav>
    <div class="p-4 text-xs text-slate-500">Data is saved in this browser.<br><button class="underline mt-1" onclick="resetData()">Reset sample data</button></div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between px-4 sm:px-6 h-14">
        <h1 id="pageTitle" class="font-bold text-lg">Dashboard</h1>
        <button id="themeBtn" onclick="toggleTheme()" class="btn btn-ghost" aria-label="Toggle light or dark mode">
          <span id="themeIcon">🌙</span><span id="themeTxt" class="hidden sm:inline">Dark mode</span>
        </button>
      </div>
      <!-- Mobile tabs -->
      <nav id="topNav" class="lg:hidden flex gap-1 overflow-x-auto px-3 pb-2"></nav>
    </header>
    <main id="view" class="p-4 sm:p-6 max-w-7xl w-full mx-auto"></main>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/60 p-0 sm:p-4" onclick="if(event.target===this)closeModal()">
  <form id="mForm" class="card w-full sm:max-w-md max-h-[92vh] overflow-y-auto p-5 rounded-b-none sm:rounded-b-xl">
    <div class="flex justify-between items-center mb-4"><h2 id="mTitle" class="font-bold text-lg"></h2><button type="button" onclick="closeModal()" class="text-slate-500 text-xl leading-none" aria-label="Close">×</button></div>
    <div id="mFields" class="space-y-3"></div><div id="mWarn" class="mt-3"></div>
    <div class="flex gap-2 justify-end mt-5"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn" id="mSave">Save</button></div>
  </form>
</div>
<div id="invoice" aria-hidden="true"></div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-semibold shadow-lg"></div>

<script>
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const money=n=>'৳'+Math.round(n).toLocaleString('en-US');
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const norm=p=>String(p||'').replace(/\D/g,'').replace(/^880?/,'0').replace(/^(?!0)/,'0');
const isBad=p=>norm(p).length>5?S.blacklist.find(b=>norm(b.phone)===norm(p)):null;

/* ---------- Theme (persistent) ---------- */
function paintTheme(){const d=document.documentElement.classList.contains('dark');$('#themeIcon').textContent=d?'☀️':'🌙';$('#themeTxt').textContent=d?'Light mode':'Dark mode';}
function toggleTheme(){const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('bizdesk_theme',d?'dark':'light')}catch(e){}paintTheme();}

/* ---------- Data ---------- */
const KEY='bizdesk_data_v1';
const seed=()=>({
 blacklist:[{phone:'01955-121212',reason:'Fake orders, refused delivery 3 times'},{phone:'01711-999000',reason:'Chargeback / payment dispute'}],
 orders:[
  {id:'ORD-1009',customer:'Unknown Buyer',phone:'01955-121212',products:'Sneakers ×2',total:7600,status:'Pending',date:day(0)},
  {id:'ORD-1008',customer:'Nusrat Jahan',phone:'01711-223344',products:'Silk Saree ×1',total:4500,status:'Pending',date:day(0)},
  {id:'ORD-1007',customer:'Rakib Hasan',phone:'01819-556677',products:'Leather Wallet ×2',total:2400,status:'Processing',date:day(0)},
  {id:'ORD-1006',customer:'Tania Akter',phone:'01922-889900',products:'Handbag ×1, Scarf ×2',total:5200,status:'Delivered',date:day(-1)},
  {id:'ORD-1005',customer:'Imran Khan',phone:'01611-445566',products:'Sneakers ×1',total:3800,status:'Delivered',date:day(-2)},
  {id:'ORD-1004',customer:'Sadia Islam',phone:'01544-778899',products:'Panjabi ×3',total:6900,status:'Processing',date:day(-2)},
  {id:'ORD-1003',customer:'Mehedi Hasan',phone:'01788-110022',products:'Watch ×1',total:7500,status:'Cancelled',date:day(-3)},
  {id:'ORD-1002',customer:'Farzana Rahman',phone:'01833-667788',products:'Handbag ×2',total:7000,status:'Delivered',date:day(-5)},
  {id:'ORD-1001',customer:'Sohel Rana',phone:'01999-334455',products:'Leather Wallet ×1',total:1200,status:'Delivered',date:day(-6)}],
 products:[
  {name:'Silk Saree',sku:'SAR-001',stock:24,buy:2800,sell:4500,min:8},
  {name:'Leather Wallet',sku:'WAL-014',stock:6,buy:700,sell:1200,min:10},
  {name:'Designer Handbag',sku:'BAG-007',stock:15,buy:2000,sell:3500,min:6},
  {name:'Cotton Panjabi',sku:'PAN-022',stock:3,buy:1500,sell:2300,min:8},
  {name:'Running Sneakers',sku:'SHO-031',stock:19,buy:2300,sell:3800,min:6},
  {name:'Silk Scarf',sku:'SCF-005',stock:0,buy:350,sell:700,min:10}],
 employees:[
  {id:1,name:'Anika Sultana',role:'Store Manager',phone:'01712-000111',salary:35000,att:'Present'},
  {id:2,name:'Jahid Hossain',role:'Delivery Coordinator',phone:'01812-000222',salary:22000,att:'Present'},
  {id:3,name:'Mim Chowdhury',role:'Social Media Executive',phone:'01912-000333',salary:25000,att:'Late'},
  {id:4,name:'Shakil Ahmed',role:'Packing Staff',phone:'01612-000444',salary:15000,att:'Absent'}],
 advances:[
  {emp:'Jahid Hossain',date:day(-4),amt:3000,note:'Advance'},
  {emp:'Shakil Ahmed',date:day(-9),amt:2000,note:'Advance'},
  {emp:'Anika Sultana',date:day(-12),amt:10000,note:'Salary paid (part)'}],
 posts:[
  {platform:'Facebook',date:day(1),caption:'Eid collection preview – silk sarees now in stock!',status:'Scheduled'},
  {platform:'Instagram',date:day(2),caption:'Behind the scenes: how we pack your order 📦',status:'Draft'},
  {platform:'TikTok',date:day(3),caption:'Handbag unboxing – 15s reel',status:'Scheduled'},
  {platform:'Facebook',date:day(-1),caption:'Weekend flash sale: 15% off wallets',status:'Published'},
  {platform:'Instagram',date:day(5),caption:'Customer review spotlight ⭐',status:'Draft'}],
 ledger:[
  {date:day(0),type:'Income',cat:'Other Income',desc:'Wholesale payment',amt:12000},
  {date:day(0),type:'Expense',cat:'Marketing',desc:'Facebook ads boost',amt:3500},
  {date:day(-1),type:'Expense',cat:'Delivery',desc:'Courier charges',amt:1800},
  {date:day(-3),type:'Expense',cat:'Rent',desc:'Shop rent',amt:18000},
  {date:day(-4),type:'Expense',cat:'Utilities',desc:'Electricity & internet',amt:4200},
  {date:day(-8),type:'Expense',cat:'Purchase',desc:'Stock purchase – scarves',amt:9000}]
});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
S.blacklist=S.blacklist||seed().blacklist;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function resetData(){if(confirm('Replace all data with the sample data?')){S=seed();save();render();toast('Sample data restored')}}

/* ---------- UI helpers ---------- */
const stCls={Pending:'bg-amber-100 text-amber-800 dark:bg-amber-500/20 dark:text-amber-300',Processing:'bg-sky-100 text-sky-800 dark:bg-sky-500/20 dark:text-sky-300',Delivered:'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300',Cancelled:'bg-rose-100 text-rose-800 dark:bg-rose-500/20 dark:text-rose-300',
 Present:'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300',Late:'bg-amber-100 text-amber-800 dark:bg-amber-500/20 dark:text-amber-300',Absent:'bg-rose-100 text-rose-800 dark:bg-rose-500/20 dark:text-rose-300',
 Draft:'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200',Scheduled:'bg-sky-100 text-sky-800 dark:bg-sky-500/20 dark:text-sky-300',Published:'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300'};
const badge=s=>`<span class="badge ${stCls[s]||''}">${esc(s)}</span>`;
const sel=(opts,val,fn)=>`<select class="inp !w-auto !py-1" onchange="${fn}(this.value)">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
const table=(head,rows,empty)=>`<div class="card overflow-x-auto"><table class="w-full"><thead><tr>${head.map(h=>`<th class="th">${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="td text-slate-500" colspan="${head.length}">${empty}</td></tr>`}</tbody></table></div>`;
const head=(t,btn)=>`<div class="flex items-center justify-between gap-3 mb-4 flex-wrap"><h2 class="font-bold text-xl">${t}</h2><div class="flex gap-2 flex-wrap">${btn||''}</div></div>`;
const stat=(l,v,sub,c)=>`<div class="card p-4 min-w-0 overflow-hidden flex flex-col justify-between gap-1"><div class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 truncate">${l}</div><div class="text-lg sm:text-2xl font-bold leading-tight [overflow-wrap:anywhere] ${c||''}">${v}</div><div class="text-[11px] sm:text-xs text-slate-500 truncate">${sub}</div></div>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2000)}

/* ---------- Modal / forms ---------- */
let onSubmit=null;
function openModal(title,fields,cb,saveLabel){
  $('#mTitle').textContent=title;$('#mSave').textContent=saveLabel||'Save';
  $('#mFields').innerHTML=fields.map(f=>`<label class="block"><span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${f.l}</span>${
    f.opts?`<select name="${f.k}" class="inp mt-1">${f.opts.map(o=>`<option ${o===f.v?'selected':''}>${o}</option>`).join('')}</select>`
    :f.t==='area'?`<textarea name="${f.k}" rows="3" class="inp mt-1" ${f.req===false?'':'required'}>${esc(f.v||'')}</textarea>`
    :`<input name="${f.k}" type="${f.t||'text'}" class="inp mt-1" ${f.v!==undefined?`value="${esc(f.v)}"`:''} ${f.t==='number'?'min="0" step="any"':''} ${f.req===false?'':'required'}>`}</label>`).join('');
  onSubmit=cb;$('#mWarn').innerHTML='';const m=$('#modal');m.classList.remove('hidden');m.classList.add('flex');
  const first=m.querySelector('input,select,textarea');first&&first.focus();
}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.classList.remove('flex')}
$('#mForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));onSubmit&&onSubmit(d);save();closeModal();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Actions ---------- */
const nextOrderId=()=>'ORD-'+(Math.max(1000,...S.orders.map(o=>+o.id.split('-')[1]))+1);
function addOrder(){orderForm()}
function editOrder(i){orderForm(i)}
function orderForm(i){const n=i===undefined,o=n?{}:S.orders[i];
  openModal(n?'New order':'Edit order '+o.id,[{k:'customer',l:'Customer name',v:o.customer},{k:'phone',l:'Phone',t:'tel',v:o.phone},{k:'products',l:'Products (e.g. Handbag ×2)',v:o.products},{k:'total',l:'Total amount (৳)',t:'number',v:o.total},{k:'status',l:'Status',opts:['Pending','Processing','Delivered','Cancelled'],v:o.status}],
  d=>{const r={customer:d.customer,phone:d.phone,products:d.products,total:+d.total,status:d.status};
    if(n)S.orders.unshift({id:nextOrderId(),date:day(0),...r});else Object.assign(S.orders[i],r);
    toast(isBad(d.phone)?'⚠ Saved – customer is blacklisted':n?'Order added':'Order updated')},n?'Add order':'Save changes');
  const ph=$('#mFields [name=phone]'),chk=()=>{const b=isBad(ph.value);$('#mWarn').innerHTML=b?`<div class="p-3 rounded-lg text-sm bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/30 text-rose-800 dark:text-rose-300"><b>⚠ Fraud alert:</b> this number is blacklisted – ${esc(b.reason)}</div>`:''};
  ph.addEventListener('input',chk);chk()}
function addBlack(){openModal('Blacklist a number',[{k:'phone',l:'Phone',t:'tel'},{k:'reason',l:'Reason'}],d=>{S.blacklist.push({phone:d.phone,reason:d.reason});toast('Number blacklisted')},'Add to blacklist')}
function setOrder(i,v){S.orders[i].status=v;save();render();toast('Order '+S.orders[i].id+' → '+v)}
function addProduct(){productForm()}
function editProduct(i){productForm(i)}
function productForm(i){const n=i===undefined,p=n?{min:5}:S.products[i];
  openModal(n?'Add product':'Edit '+p.name,[{k:'name',l:'Product name',v:p.name},{k:'sku',l:'SKU',v:p.sku},{k:'stock',l:'Stock count',t:'number',v:p.stock},{k:'min',l:'Low-stock alert at',t:'number',v:p.min},{k:'buy',l:'Buying price (৳)',t:'number',v:p.buy},{k:'sell',l:'Selling price (৳)',t:'number',v:p.sell}],
  d=>{const r={name:d.name,sku:d.sku,stock:+d.stock,min:+d.min,buy:+d.buy,sell:+d.sell};if(n)S.products.push(r);else Object.assign(S.products[i],r);toast(n?'Product added':'Product updated')},n?'Add product':'Save changes')}
function restock(i){openModal('Restock '+S.products[i].name,[{k:'qty',l:'Quantity received',t:'number'}],d=>{S.products[i].stock+=+d.qty;toast('Stock updated')},'Add stock')}
function addEmployee(){employeeForm()}
function editEmployee(i){employeeForm(i)}
function employeeForm(i){const n=i===undefined,e=n?{}:S.employees[i];
  openModal(n?'Add employee':'Edit '+e.name,[{k:'name',l:'Full name',v:e.name},{k:'role',l:'Designation',v:e.role},{k:'phone',l:'Contact',t:'tel',v:e.phone},{k:'salary',l:'Monthly salary (৳)',t:'number',v:e.salary}],
  d=>{const r={name:d.name,role:d.role,phone:d.phone,salary:+d.salary};if(n)S.employees.push({id:Date.now(),att:'Present',...r});else Object.assign(S.employees[i],r);toast(n?'Employee added':'Employee updated')},n?'Add employee':'Save changes')}
function setAtt(i,v){S.employees[i].att=v;save();render()}
function addAdvance(){openModal('Record payment',[{k:'emp',l:'Employee',opts:S.employees.map(e=>e.name)},{k:'note',l:'Type',opts:['Advance','Salary paid']},{k:'amt',l:'Amount (৳)',t:'number'}],
  d=>{S.advances.unshift({emp:d.emp,note:d.note,amt:+d.amt,date:day(0)});S.ledger.unshift({date:day(0),type:'Expense',cat:'Payroll',desc:d.note+' – '+d.emp,amt:+d.amt});toast('Payment recorded')},'Record payment')}
function addPost(){openModal('Schedule post',[{k:'platform',l:'Platform',opts:['Facebook','Instagram','TikTok']},{k:'date',l:'Publish date',t:'date',v:day(1)},{k:'caption',l:'Caption',t:'area'},{k:'status',l:'Status',opts:['Draft','Scheduled','Published']}],
  d=>{S.posts.push({platform:d.platform,date:d.date,caption:d.caption,status:d.status});toast('Post saved')},'Save post')}
function setPost(i,v){S.posts[i].status=v;save();render()}
function addEntry(type){openModal(type==='Income'?'Add income':'Add expense',[{k:'cat',l:'Category',opts:type==='Income'?['Other Income','Wholesale','Refund received']:['Rent','Utilities','Marketing','Delivery','Purchase','Payroll','Other']},{k:'desc',l:'Description'},{k:'amt',l:'Amount (৳)',t:'number'},{k:'date',l:'Date',t:'date',v:day(0)}],
  d=>{S.ledger.unshift({date:d.date,type,cat:d.cat,desc:d.desc,amt:+d.amt});toast(type+' added')},'Add '+type.toLowerCase())}
function del(arr,i){S[arr].splice(i,1);save();render();toast('Deleted')}
const delBtn=(a,i)=>`<button class="text-rose-600 dark:text-rose-400 text-xs font-semibold hover:underline" onclick="del('${a}',${i})">Delete</button>`;

const acts=(a,i,edit,extra)=>`<div class="flex gap-3 items-center">${extra||''}${edit?`<button class="text-brand-700 dark:text-brand-500 text-xs font-semibold hover:underline" onclick="${edit}(${i})">Edit</button>`:''}${delBtn(a,i)}</div>`;
const blackCard=()=>`<div class="card p-4 mt-4 overflow-hidden"><div class="flex items-center justify-between gap-2 mb-3 flex-wrap"><div class="font-semibold">🛡 Fraud blacklist (${S.blacklist.length})</div><button class="btn btn-ghost !py-1" onclick="addBlack()">+ Add number</button></div><div class="flex flex-wrap gap-2">${S.blacklist.map((b,i)=>`<span class="inline-flex items-center gap-2 max-w-full px-3 py-1 rounded-full text-xs bg-rose-50 dark:bg-rose-500/10 text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-500/30"><span class="truncate"><b>${esc(b.phone)}</b> – ${esc(b.reason)}</span><button class="font-bold" onclick="del('blacklist',${i})" aria-label="Remove from blacklist">×</button></span>`).join('')||'<span class="text-sm text-slate-500">No blacklisted numbers.</span>'}</div></div>`;

/* ---------- AI business insights (rule-based, runs offline) ---------- */
function insights(){
  const t=totals(),tips=[],n=S.orders.length,cats={};
  S.ledger.filter(l=>l.type==='Expense').forEach(l=>cats[l.cat]=(cats[l.cat]||0)+l.amt);
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  if(t.income>0){const r=t.exp/t.income;tips.push(r>0.6?`⚠️ Expenses are ${Math.round(r*100)}% of income.${top?` ${esc(top[0])} is your biggest cost (${money(top[1])}) – review it first.`:''}`:`✅ Healthy margin: you keep ${Math.round((1-r)*100)}% of income as profit.${top?` Watch ${esc(top[0])}, your largest expense.`:''}`)}
  else tips.push('Record your first delivered order or income to unlock profit insights.');
  const bad=S.orders.filter(o=>['Pending','Processing'].includes(o.status)&&isBad(o.phone));
  if(bad.length)tips.push(`🚨 ${bad.length} active order${bad.length>1?'s are':' is'} from blacklisted numbers (${bad.map(o=>o.id).join(', ')}). Verify first or ask for advance payment.`);
  const can=S.orders.filter(o=>o.status==='Cancelled').length;
  if(n&&can/n>0.12)tips.push(`📦 ${Math.round(can/n*100)}% of orders were cancelled. Confirm by phone before dispatch to reduce returns.`);
  const pend=S.orders.filter(o=>o.status==='Pending').length;
  if(pend)tips.push(`⏱ ${pend} order${pend>1?'s are':' is'} still pending. Faster dispatch improves repeat purchases.`);
  if(t.low.length)tips.push(`🏷 Restock ${t.low.slice(0,2).map(p=>esc(p.name)).join(' & ')}${t.low.length>2?' and others':''} soon to avoid lost sales.`);
  return`<div class="card p-4 mt-4 overflow-hidden border-brand-500/40 bg-brand-50/60 dark:bg-brand-900/20"><div class="font-semibold mb-2">🤖 Smart business tips</div><ul class="space-y-1.5 text-sm">${tips.slice(0,4).map(x=>`<li>${x}</li>`).join('')}</ul></div>`}

/* ---------- Invoice (print / Save as PDF) ---------- */
function invoice(i){
  const o=S.orders[i],items=o.products.split(',').map(s=>s.trim()).filter(Boolean),paid=o.status==='Delivered';
  $('#invoice').innerHTML=`<div style="max-width:720px;margin:0 auto;padding:32px;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:14px;color:#111">
  <div style="display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0f766e;padding-bottom:16px"><div><div style="font-size:24px;font-weight:800;color:#0f766e">BizDesk Store</div><div style="color:#555">Dhaka, Bangladesh · 01700-000000</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:700">INVOICE</div><div>#INV-${esc(o.id.slice(4))}</div><div>${esc(o.date)}</div></div></div>
  <div style="margin:20px 0"><div style="color:#555">Billed to</div><div style="font-weight:700">${esc(o.customer)}</div><div>${esc(o.phone)}</div></div>
  <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f0fdfa"><th style="text-align:left;padding:10px;border-bottom:1px solid #ccc">Item</th></tr></thead><tbody>${items.map(x=>`<tr><td style="padding:10px;border-bottom:1px solid #eee">${esc(x)}</td></tr>`).join('')}</tbody></table>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:14px;background:#f0fdfa;font-size:18px;font-weight:800"><span>Total</span><span>${money(o.total)}</span></div>
  <div style="margin-top:16px;font-weight:700;color:${paid?'#047857':'#b45309'}">${paid?'PAID – Delivered':'Status: '+esc(o.status)+' · Payment due on delivery'}</div>
  <div style="margin-top:40px;text-align:center;color:#777;font-size:12px">Thank you for shopping with us!</div></div>`;
  toast('Choose "Save as PDF" in the print window');setTimeout(()=>window.print(),250)}

/* ---------- Calculations ---------- */
function totals(){
  const delivered=sum(S.orders.filter(o=>o.status==='Delivered'),o=>o.total);
  const income=delivered+sum(S.ledger.filter(l=>l.type==='Income'),l=>l.amt);
  const exp=sum(S.ledger.filter(l=>l.type==='Expense'),l=>l.amt);
  return{delivered,income,exp,profit:income-exp,active:S.orders.filter(o=>['Pending','Processing'].includes(o.status)).length,
    low:S.products.filter(p=>p.stock<=p.min)}
}

/* ---------- Views ---------- */
const V={
dashboard(){const t=totals();
 const bars=[...Array(7)].map((_,i)=>{const d=day(i-6);return{d:d.slice(5),v:sum(S.orders.filter(o=>o.date===d&&o.status!=='Cancelled'),o=>o.total)}});const mx=Math.max(1,...bars.map(b=>b.v));
 return`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
  ${stat('Total sales',money(t.delivered),'Delivered orders')}
  ${stat('Active orders',t.active,'Pending + processing')}
  ${stat('Total expenses',money(t.exp),'From ledger','text-rose-600 dark:text-rose-400')}
  ${stat('Net profit',money(t.profit),t.profit>=0?'Income minus expenses':'Running at a loss',t.profit>=0?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400')}</div>
 ${insights()}
 <div class="card p-4 mt-4"><div class="font-semibold mb-3">Quick actions</div><div class="flex flex-wrap gap-2">
  <button class="btn" onclick="addOrder()">+ New order</button><button class="btn btn-ghost" onclick="addProduct()">+ Product</button><button class="btn btn-ghost" onclick="addEntry('Expense')">+ Expense</button><button class="btn btn-ghost" onclick="addEmployee()">+ Employee</button><button class="btn btn-ghost" onclick="addPost()">+ Schedule post</button></div></div>
 <div class="grid lg:grid-cols-3 gap-4 mt-4">
  <div class="card p-4 lg:col-span-2"><div class="font-semibold mb-4">Sales, last 7 days</div>
   <div class="flex items-end gap-2 h-40">${bars.map(b=>`<div class="flex-1 flex flex-col items-center justify-end h-full gap-1"><div class="text-[10px] text-slate-500">${b.v?Math.round(b.v/1000)+'k':''}</div><div class="w-full rounded-t bg-brand-600" style="height:${Math.max(3,b.v/mx*100)}%"></div><div class="text-[10px] text-slate-500">${b.d}</div></div>`).join('')}</div></div>
  <div class="card p-4"><div class="font-semibold mb-3">Low stock (${t.low.length})</div>${t.low.length?t.low.map(p=>`<div class="flex justify-between text-sm py-1.5 border-t first:border-0 border-slate-100 dark:border-slate-800"><span>${esc(p.name)}</span><span class="font-semibold ${p.stock===0?'text-rose-600':'text-amber-600'}">${p.stock===0?'Out of stock':p.stock+' left'}</span></div>`).join(''):'<div class="text-sm text-slate-500">All products are well stocked.</div>'}</div></div>
 <div class="mt-4"><div class="font-semibold mb-2">Latest orders</div>${V.ordersTable(S.orders.slice(0,4),true)}</div>`},
ordersTable(list,ro){return table(['Order','Customer','Phone','Products','Total','Status',...(ro?[]:[''])],list.map(o=>{const i=S.orders.indexOf(o);return`<tr><td class="td font-semibold">${o.id}</td><td class="td">${esc(o.customer)}${isBad(o.phone)?' <span class="badge bg-rose-100 text-rose-800 dark:bg-rose-500/20 dark:text-rose-300" title="'+esc(isBad(o.phone).reason)+'">⚠ Blacklisted</span>':''}</td><td class="td">${esc(o.phone)}</td><td class="td">${esc(o.products)}</td><td class="td font-semibold">${money(o.total)}</td><td class="td">${ro?badge(o.status):sel(['Pending','Processing','Delivered','Cancelled'],o.status,`(v=>setOrder(${i},v))`)}</td>${ro?'':`<td class="td">${acts('orders',i,'editOrder',`<button class="text-emerald-700 dark:text-emerald-400 text-xs font-semibold hover:underline" onclick="invoice(${i})">Invoice</button>`)}</td>`}</tr>`}).join(''),'No orders yet.')},
orders(){const q=(window._oq||'').toLowerCase(),f=window._of||'All';
 const list=S.orders.filter(o=>(f==='All'||o.status===f)&&(o.customer+o.id+o.phone).toLowerCase().includes(q));
 return head('Orders & delivery',`<button class="btn" onclick="addOrder()">+ New order</button>`)+
 `<div class="flex gap-2 mb-3 flex-wrap"><input class="inp !w-full sm:!w-64" placeholder="Search name, phone, ID" value="${esc(window._oq||'')}" oninput="window._oq=this.value;render('orders',true)" id="oq">${sel(['All','Pending','Processing','Delivered','Cancelled'],f,'(v=>{window._of=v;render()})')}</div>`+V.ordersTable(list)+blackCard()},
inventory(){const t=totals();return head('Inventory & stock',`<button class="btn" onclick="addProduct()">+ Add product</button>`)+
 (t.low.length?`<div class="mb-4 p-3 rounded-lg bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 text-sm text-amber-900 dark:text-amber-200"><b>${t.low.length} product${t.low.length>1?'s need':' needs'} restocking:</b> ${t.low.map(p=>esc(p.name)).join(', ')}</div>`:'')+
 table(['Product','SKU','Stock','Buy','Sell','Margin','Stock level',''],S.products.map((p,i)=>{const low=p.stock<=p.min,pct=Math.min(100,p.stock/(p.min*3)*100);return`<tr><td class="td font-semibold">${esc(p.name)}</td><td class="td">${esc(p.sku)}</td><td class="td font-semibold ${p.stock===0?'text-rose-600':low?'text-amber-600':''}">${p.stock}</td><td class="td">${money(p.buy)}</td><td class="td">${money(p.sell)}</td><td class="td">${Math.round((p.sell-p.buy)/p.sell*100)}%</td><td class="td"><div class="w-28 h-2 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full ${p.stock===0?'bg-rose-500':low?'bg-amber-500':'bg-emerald-500'}" style="width:${pct}%"></div></div><div class="text-[11px] mt-1 ${low?'text-amber-600 font-semibold':'text-slate-500'}">${p.stock===0?'Out of stock':low?'Low stock':'In stock'}</div></td><td class="td space-x-3"><button class="text-brand-700 dark:text-brand-500 text-xs font-semibold hover:underline" onclick="restock(${i})">Restock</button><button class="text-brand-700 dark:text-brand-500 text-xs font-semibold hover:underline" onclick="editProduct(${i})">Edit</button>${delBtn('products',i)}</td></tr>`}).join(''),'No products yet.')},
hr(){const pay=sum(S.employees,e=>e.salary),adv=sum(S.advances,a=>a.amt);
 return head('Employees & payroll',`<button class="btn btn-ghost" onclick="addAdvance()">Record payment</button><button class="btn" onclick="addEmployee()">+ Add employee</button>`)+
 `<div class="grid grid-cols-1 min-[400px]:grid-cols-3 gap-3 mb-4">${stat('Staff',S.employees.length,'Employees')}${stat('Monthly payroll',money(pay),'Total salaries')}${stat('Advances & paid',money(adv),'This ledger')}</div>`+
 table(['Name','Designation','Contact','Salary','Attendance today',''],S.employees.map((e,i)=>`<tr><td class="td font-semibold">${esc(e.name)}</td><td class="td">${esc(e.role)}</td><td class="td">${esc(e.phone)}</td><td class="td">${money(e.salary)}</td><td class="td">${sel(['Present','Late','Absent'],e.att,`(v=>setAtt(${i},v))`)}</td><td class="td">${acts('employees',i,'editEmployee')}</td></tr>`).join(''),'No employees yet.')+
 `<h3 class="font-semibold mt-6 mb-2">Payroll & advance ledger</h3>`+
 table(['Date','Employee','Type','Amount',''],S.advances.map((a,i)=>`<tr><td class="td">${a.date}</td><td class="td">${esc(a.emp)}</td><td class="td">${esc(a.note)}</td><td class="td font-semibold">${money(a.amt)}</td><td class="td">${delBtn('advances',i)}</td></tr>`).join(''),'No payments recorded.')},
marketing(){const plat={Facebook:'bg-blue-600',Instagram:'bg-pink-600',TikTok:'bg-slate-800 dark:bg-slate-600'};
 const sorted=S.posts.map((p,i)=>({...p,i})).sort((a,b)=>a.date.localeCompare(b.date));
 const groups={};sorted.forEach(p=>(groups[p.date]=groups[p.date]||[]).push(p));
 return head('Content planner',`<button class="btn" onclick="addPost()">+ Schedule post</button>`)+
 (sorted.length?Object.keys(groups).map(d=>`<div class="mb-4"><div class="text-sm font-bold mb-2">${new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}${d===day(0)?' <span class="badge bg-brand-100 text-brand-700">Today</span>':''}</div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${groups[d].map(p=>`<div class="card p-4"><div class="flex justify-between items-center mb-2"><span class="badge text-white ${plat[p.platform]}">${p.platform}</span>${sel(['Draft','Scheduled','Published'],p.status,`(v=>setPost(${p.i},v))`)}</div><p class="text-sm">${esc(p.caption)}</p><div class="mt-3 text-right">${delBtn('posts',p.i)}</div></div>`).join('')}</div></div>`).join(''):'<div class="card p-6 text-sm text-slate-500">No posts planned. Schedule your first post.</div>')},
finance(){const t=totals(),m=day(0).slice(0,7);
 const monthInc=t.income,tdy=day(0);
 const dayExp=sum(S.ledger.filter(l=>l.date===tdy&&l.type==='Expense'),l=>l.amt);
 const cats={};S.ledger.filter(l=>l.type==='Expense').forEach(l=>cats[l.cat]=(cats[l.cat]||0)+l.amt);
 const rows=[...S.ledger.map((l,i)=>({...l,i,src:'ledger'})),...S.orders.filter(o=>o.status==='Delivered').map(o=>({date:o.date,type:'Income',cat:'Sales',desc:o.id+' – '+o.customer,amt:o.total,src:'order'}))].sort((a,b)=>b.date.localeCompare(a.date));
 return head('Profit & loss ledger',`<button class="btn btn-ghost" onclick="addEntry('Income')">+ Income</button><button class="btn" onclick="addEntry('Expense')">+ Expense</button>`)+
 `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${stat('Total income',money(t.income),'Sales + other','text-emerald-600 dark:text-emerald-400')}${stat('Total expenses',money(t.exp),'All categories','text-rose-600 dark:text-rose-400')}${stat('Net profit',money(t.profit),'Income − expenses',t.profit>=0?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400')}${stat('Spent today',money(dayExp),'Daily expense')}</div>`+
 `<div class="card p-4 mb-4"><div class="font-semibold mb-3">Expenses by category</div>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="mb-2"><div class="flex justify-between text-sm"><span>${c}</span><span class="font-semibold">${money(v)}</span></div><div class="h-2 rounded bg-slate-200 dark:bg-slate-700"><div class="h-full rounded bg-rose-500" style="width:${v/t.exp*100}%"></div></div></div>`).join('')||'<div class="text-sm text-slate-500">No expenses yet.</div>'}</div>`+
 table(['Date','Type','Category','Description','Amount',''],rows.map(r=>`<tr><td class="td">${r.date}</td><td class="td">${badge(r.type==='Income'?'Delivered':'Cancelled').replace(/>[^<]+</,'>'+r.type+'<')}</td><td class="td">${esc(r.cat)}</td><td class="td">${esc(r.desc)}</td><td class="td font-semibold ${r.type==='Income'?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400'}">${r.type==='Income'?'+':'−'}${money(r.amt)}</td><td class="td">${r.src==='ledger'?delBtn('ledger',r.i):'<span class="text-xs text-slate-400">auto</span>'}</td></tr>`).join(''),'No entries yet.')}
};

/* ---------- Navigation ---------- */
const TABS=[['dashboard','📊','Dashboard'],['orders','📦','Orders'],['inventory','🏷️','Inventory'],['hr','👥','HR & Payroll'],['marketing','📣','Marketing'],['finance','💰','Finance']];
let tab=(()=>{try{return localStorage.getItem('bizdesk_tab')}catch(e){}})();if(!V[tab])tab='dashboard';
function go(t){tab=t;try{localStorage.setItem('bizdesk_tab',t)}catch(e){}render();scrollTo(0,0)}
function render(t,keepFocus){
  const v=$('#view');
  v.innerHTML=`<div class="tab-in">${V[tab]()}</div>`;
  $('#pageTitle').textContent=TABS.find(x=>x[0]===tab)[2];
  $('#sideNav').innerHTML=TABS.map(([k,i,l])=>`<button onclick="go('${k}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-left ${k===tab?'bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-100':'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}"><span>${i}</span>${l}</button>`).join('');
  $('#topNav').innerHTML=TABS.map(([k,i,l])=>`<button onclick="go('${k}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold ${k===tab?'bg-brand-700 text-white':'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${i} ${l}</button>`).join('');
  if(keepFocus){const el=$('#oq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}
paintTheme();render();save();
