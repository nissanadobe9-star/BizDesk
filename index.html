<script>
/* =========================================================
   1. HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = (offset = 0) => {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const thisMonth = () => iso(0).slice(0, 7);
const shiftYm = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = ym => new Date(ym + '-01T00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const monthShort = ym => new Date(ym + '-01T00:00').toLocaleDateString('en-GB', { month: 'short' });
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const money = n => (n < 0 ? '−' : '') + '৳' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const pct = x => Math.round((x || 0) * 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const last10 = p => String(p || '').replace(/\D/g, '').slice(-10);
const orderNo = o => 'ORD-' + o.no;
const STATUSES = ['Pending', 'Processing', 'Delivered', 'Cancelled'];
const EXP_CATS = ['Marketing', 'Delivery', 'Rent', 'Utilities', 'Purchase', 'Payroll', 'Other'];
const INC_CATS = ['Wholesale', 'Other Income', 'Refund received'];
const ALL_CATS = [...INC_CATS, ...EXP_CATS];

// "Silk Saree ×2, Scarf x1" -> [{name, qty}]
function parseItems(s) {
  return String(s || '').split(',').map(t => t.trim()).filter(Boolean).map(t => {
    const m = t.match(/^(.+?)\s*[×x]\s*(\d+)$/i);
    return m ? { name: m[1].trim(), qty: +m[2] } : { name: t, qty: 1 };
  });
}
const sameName = (a, b) => { const x = a.toLowerCase(), y = b.toLowerCase(); return x.includes(y) || y.includes(x); };

/* =========================================================
   2. DATA (localStorage, same key as the previous version)
   ========================================================= */
const KEY = 'bizdesk_data_v1';
const THEME_KEY = 'bizdesk_theme';
const TAB_KEY = 'bizdesk_tab';

function seed() {

      { no: 1007, customer: 'Rakib Hasan', phone: '01819-556677', products: 'Leather Wallet ×2', total: 2400, status: 'Processing', date: iso(0) },

      { name: 'Designer Handbag', sku: 'BAG-007', stock: 15, min: 6, buy: 2000, sell: 3500 },
      { name: 'Cotton Panjabi', sku: 'PAN-022', stock: 3, min: 8, buy: 1500, sell: 2300 },

    ],

    ],

    ],

      { date: iso(0), type: 'Expense', cat: 'Marketing', desc: 'Facebook ads boost', amt: 2500 },
      { date: iso(-1), type: 'Expense', cat: 'Delivery', desc: 'Courier charges', amt: 1200 },
      { date: iso(-3), type: 'Expense', cat: 'Rent', desc: 'Shop rent', amt: 6000 },

      { date: iso(-8), type: 'Expense', cat: 'Purchase', desc: 'Stock purchase – scarves', amt: 6000 },
      { date: iso(-4), type: 'Expense', cat: 'Payroll', desc: 'Advance – Jahid Hossain', amt: 3000, ref: 'a1', locked: true },
      { date: iso(-9), type: 'Expense', cat: 'Payroll', desc: 'Advance – Shakil Ahmed', amt: 2000, ref: 'a2', locked: true },
      { date: iso(-12), type: 'Expense', cat: 'Payroll', desc: 'Salary paid (part) – Anika Sultana', amt: 5000, ref: 'a3', locked: true }
    ],
    blacklist: [
      { phone: '01955-121212', reason: 'Fake orders, refused delivery 3 times' },
      { phone: '01711-999000', reason: 'Chargeback / payment dispute' }
    ]
  };
}

// Fill in missing ids, keep legacy order numbers, and make all ids strings
function migrate(d) {
  const fresh = seed();
  ['orders', 'products', 'employees', 'advances', 'posts', 'ledger', 'blacklist'].forEach(k => {
    if (!Array.isArray(d[k])) d[k] = fresh[k];
    d[k].forEach(r => { r.id = r.id ? String(r.id) : uid(); });
  });
  let n = 1000;
  d.orders.forEach(o => {
    if (!o.no) { const m = String(o.id).match(/^ORD-(\d+)$/); o.no = m ? +m[1] : 0; }
    n = Math.max(n, o.no);
  });
  d.orders.forEach(o => { if (!o.no) o.no = ++n; });
  return d;
}

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return migrate(seed());
}
let S = load();

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Storage is full or blocked in this browser', true); }
}

function resetData() {
  if (!confirm('Replace all data with the sample data?')) return;
  S = migrate(seed());
  commit('Sample data restored');
}

/* Data changes always go through commit(): save, re-render, notify */
function commit(msg, warn = false) {
  persist();
  render();
  if (msg) toast(msg, warn);
}

// Generic update of one field on one record
function patch(arr, id, field, val, msg) {
  const r = S[arr].find(x => x.id === id);
  if (!r) return;
  r[field] = val;
  commit(msg);
}

// Generic delete. Deleting a payment also removes its linked ledger entry.
function remove(arr, id, msg = 'Deleted') {
  const list = S[arr], i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  if (arr === 'ledger' && list[i].locked) return toast('Managed in HR. Delete the payment instead.', true);
  list.splice(i, 1);
  if (arr === 'advances') S.ledger = S.ledger.filter(l => l.ref !== id);
  commit(msg);
}

/* =========================================================
   3. FRAUD / BLACKLIST
   ========================================================= */
function isBad(phone) {
  const k = last10(phone);
  if (k.length < 10) return null;
  return S.blacklist.find(b => last10(b.phone) === k) || null;
}

/* =========================================================
   4. FINANCIAL ANALYSIS
   ========================================================= */
function unitsFor(list) {
  const map = {};
  list.forEach(o => parseItems(o.products).forEach(it => {
    const p = S.products.find(x => sameName(x.name, it.name));
    const key = p ? p.id : 'n:' + it.name.toLowerCase();
    if (!map[key]) map[key] = { name: p ? p.name : it.name, p: p || null, units: 0 };
    map[key].units += it.qty;
  }));
  return Object.values(map).sort((a, b) => b.units - a.units);
}

// ym = 'YYYY-MM' to scope to one month, or null for all data
function summary(ym) {
  const inScope = d => !ym || String(d || '').startsWith(ym);
  const orders = S.orders.filter(o => inScope(o.date));
  const delivered = orders.filter(o => o.status === 'Delivered');
  const cancelled = orders.filter(o => o.status === 'Cancelled');
  const ledger = S.ledger.filter(l => inScope(l.date));
  const sales = sum(delivered, o => o.total);
  const otherInc = sum(ledger.filter(l => l.type === 'Income'), l => l.amt);
  const cats = {};
  ledger.filter(l => l.type === 'Expense').forEach(l => { cats[l.cat] = (cats[l.cat] || 0) + l.amt; });
  const expenses = sum(Object.values(cats), x => x);
  const income = sales + otherInc;
  return {
    sales, otherInc, income, expenses, cats,
    profit: income - expenses,
    margin: income ? (income - expenses) / income : 0,
    orders: orders.length,
    delivered: delivered.length,
    cancelled: cancelled.length,
    cancelledValue: sum(cancelled, o => o.total),
    cancelRate: orders.length ? cancelled.length / orders.length : 0,
    pending: orders.filter(o => ['Pending', 'Processing'].includes(o.status)).length,
    aov: delivered.length ? sales / delivered.length : 0,
    units: unitsFor(delivered)
  };
}

// Rule-based advisor: runs fully offline on the saved data
function analyze() {
  const A = summary(null), inc = A.income, exp = A.expenses, cats = A.cats;
  const unitsOf = p => { const u = A.units.find(x => x.p === p); return u ? u.units : 0; };
  const sellers = A.units.filter(u => u.units > 0);
  const best = sellers[0];
  const topCat = Object.entries(cats).sort((a, b) => b[1] - a[1])[0];
  const mkt = cats.Marketing || 0, dlv = cats.Delivery || 0, pay = cats.Payroll || 0;
  const low = S.products.filter(p => p.stock <= p.min);
  const over = S.products.filter(p => p.stock >= p.min * 3 && unitsOf(p) <= 1);
  const thin = S.products.filter(p => p.sell && (p.sell - p.buy) / p.sell < 0.25 && unitsOf(p) > 0);
  const badOpen = S.orders.filter(o => ['Pending', 'Processing'].includes(o.status) && isBad(o.phone));
  const absent = S.employees.filter(e => e.att === 'Absent').length;
  const late = S.employees.filter(e => e.att === 'Late').length;
  const tips = [];
  let score = 100, save = 0;

  if (!inc) {
    return { tips: [{ k: 'grow', lv: 'med', t: 'Add your first sales or income', b: 'Record delivered orders or income entries to unlock profit and cost analysis.', impact: '' }], score: 50, label: 'Needs data', save: 0, A, best };
  }

  // Cost ratio
  const r = exp / inc;
  if (r > 0.7) {
    score -= 25;
    const s = exp * 0.15; save += s;
    tips.push({ k: 'cost', lv: 'high', t: 'Expenses are too high for your income',
      b: `Costs are ${pct(r)}% of income.${topCat ? ` ${topCat[0]} is the biggest cost at ${money(topCat[1])}.` : ''} Set a monthly spending cap about 15% below this level and approve anything above it.`,
      impact: `Could save about ${money(s)}` });
  } else if (r > 0.5) {
    score -= 10;
    const s = topCat ? topCat[1] * 0.1 : 0; save += s;
    tips.push({ k: 'cost', lv: 'med', t: 'Costs are creeping up',
      b: `Costs are ${pct(r)}% of income, leaving little room for slow months.${topCat ? ` Trim 10% from ${topCat[0]}, your largest expense.` : ''}`,
      impact: `Could save about ${money(s)}` });
  } else {
    tips.push({ k: 'grow', lv: 'ok', t: 'Healthy cost ratio',
      b: `You keep ${pct(1 - r)}% of income after costs. Reinvest part of that surplus in your best seller's stock so it never runs out.`,
      impact: 'Protects margin as you grow' });
  }

  // Marketing efficiency
  if (mkt / inc > 0.08) {
    const hot = mkt / inc > 0.15;
    score -= hot ? 10 : 5;
    const s = mkt * 0.2; save += s;
    tips.push({ k: 'cost', lv: hot ? 'high' : 'med', t: 'Cut paid marketing that does not sell',
      b: `Marketing takes ${pct(mkt / inc)}% of income (${money(mkt)}). Stop boosts with no orders, move 20% of the budget into scheduled organic posts and customer reviews, and track orders per campaign.`,
      impact: `Could save about ${money(s)}` });
  }

  // Delivery cost per order
  if (A.delivered && dlv / A.delivered > 250) {
    const s = dlv * 0.15; save += s;
    tips.push({ k: 'cost', lv: 'med', t: 'Reduce delivery cost per order',
      b: `Delivery costs ${money(dlv / A.delivered)} per delivered order. Batch nearby addresses into one courier trip, and offer free delivery above ৳2,000 to raise order size.`,
      impact: `Could save about ${money(s)}` });
  }

  // Cancellations and returns
  if (A.cancelRate > 0.1) {
    if (A.cancelRate > 0.12) score -= 10;
    tips.push({ k: 'protect', lv: 'med', t: 'Stop losing orders to cancellations',
      b: `${A.cancelled} order${A.cancelled > 1 ? 's were' : ' was'} cancelled (${money(A.cancelledValue)}), ${pct(A.cancelRate)}% of all orders. Confirm by phone before dispatch, ask for a small advance on orders above ৳5,000, and blacklist repeat cancellers.`,
      impact: `Could recover up to ${money(A.cancelledValue * 0.5)}` });
  }

  // Fraud exposure
  if (badOpen.length) {
    score -= 10;
    tips.push({ k: 'protect', lv: 'high', t: 'Verify orders from blacklisted numbers',
      b: `${badOpen.length} open order${badOpen.length > 1 ? 's come' : ' comes'} from blacklisted numbers (${badOpen.map(orderNo).join(', ')}). Call to confirm, request an advance payment, or cancel before dispatch.`,
      impact: `Protects ${money(sum(badOpen, o => o.total))} in orders` });
  }

  // Backlog
  if (A.pending >= 2) {
    score -= 5;
    tips.push({ k: 'grow', lv: 'med', t: 'Clear the pending order backlog',
      b: `${A.pending} orders are waiting to be processed. Confirm and dispatch within 24 hours, since slow dispatch hurts repeat purchases.`,
      impact: 'Faster delivery, more repeat orders' });
  }

  // Payroll and advances
  if (pay / inc > 0.3) {
    tips.push({ k: 'cost', lv: 'med', t: 'Tighten staff advances',
      b: `Advances total ${money(pay)}, ${pct(pay / inc)}% of income. Cap advances at half a monthly salary and agree a repayment schedule in writing.`,
      impact: 'Keeps cash flow steady' });
  }

  // Thin net margin
  if ((inc - exp) / inc < 0.1) {
    score -= 15;
    tips.push({ k: 'cost', lv: 'high', t: 'Net profit margin is thin',
      b: `You keep only ${pct((inc - exp) / inc)}% of income as profit. Review your top expenses and raise prices on your slowest-margin products.`,
      impact: 'Restores a safe buffer' });
  }

  // Stock
  if (low.length) {
    score -= Math.min(15, low.length * 5);
    const hot = low.filter(p => unitsOf(p) > 0);
    tips.push({ k: 'grow', lv: 'high', t: 'Restock items at or below alert level',
      b: `${low.map(p => p.name).join(', ')} ${low.length > 1 ? 'are' : 'is'} at or below the alert level${hot.length ? `. ${hot.map(p => p.name).join(', ')} ${hot.length > 1 ? 'have' : 'has'} sold recently, so each day out of stock loses sales` : ''}. Reorder now.`,
      impact: `Protects about ${money(sum(low, p => p.sell * p.min))} in sales` });
  }

  // Overstock: cash tied up in slow stock
  if (over.length) {
    tips.push({ k: 'cost', lv: 'med', t: 'Turn slow stock into cash',
      b: `${over.map(p => p.name).join(', ')} ${over.length > 1 ? 'have' : 'has'} several times the stock needed and barely sells. Run a bundle or flash sale to convert it into cash.`,
      impact: `Frees up ${money(sum(over, p => p.stock * p.buy))} tied up in stock` });
  }

  // Thin-margin pricing
  if (thin.length) {
    tips.push({ k: 'cost', lv: 'med', t: 'Review pricing on thin-margin products',
      b: `${thin.map(p => p.name).join(', ')} earn under 25% margin. Raise prices 5–10% or find a cheaper supplier. Every extra taka on these goes straight to profit.`,
      impact: 'Adds profit on every unit sold' });
  }

  // Growth: best seller
  if (best) {
    const bp = best.p ? best.p.sell : 0;
    tips.push({ k: 'grow', lv: 'ok', t: `Push your best seller: ${best.name}`,
      b: `${best.name} sold ${best.units} unit${best.units > 1 ? 's' : ''} in delivered sales, more than any other product. Feature it in your next posts, bundle it with a slow seller, and keep its stock above the alert level.`,
      impact: bp ? `A 15% sales lift adds about ${money(bp * best.units * 0.15)}` : 'Feature it in your next posts' });
  }

  // Growth: basket size
  if (A.delivered && A.aov < 2500) {
    tips.push({ k: 'grow', lv: 'med', t: 'Raise your average order value',
      b: `An average delivered order is ${money(A.aov)}. Offer "buy 2, get 10% off" bundles or a free gift above ৳3,000 to lift basket size.`,
      impact: `+10% basket ≈ ${money(A.aov * 0.1)} per order` });
  }

  // Staff
  if (absent || late) {
    tips.push({ k: 'protect', lv: absent ? 'med' : 'ok', t: 'Protect dispatch with reliable attendance',
      b: `${absent} absent and ${late} late today. Missed packing and delivery slots delay orders. Set a clear late-arrival rule and cover shifts before the day starts.`,
      impact: 'Keeps dispatch on time' });
  }

  // Standing growth tip
  tips.push({ k: 'grow', lv: 'ok', t: 'Turn buyers into repeat customers',
    b: 'Send a thank-you message after delivery and offer 5% off the next order. Keeping an existing buyer costs far less than winning a new one.',
    impact: 'Lifts repeat sales at low cost' });

  const rank = { high: 0, med: 1, ok: 2 };
  tips.sort((a, b) => rank[a.lv] - rank[b.lv]);
  score = Math.max(0, Math.min(100, Math.round(score)));
  return { tips, score, label: score >= 75 ? 'Strong' : score >= 50 ? 'Stable' : 'At risk', save, A, best };
}

/* Change vs previous month */
function chgText(cur, prev) {
  if (!prev) return cur ? 'New this month' : 'No change';
  const d = Math.round((cur - prev) / Math.abs(prev) * 100);
  return `${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs last month`;
}
function chgHTML(cur, prev, lowerIsBetter = false) {
  const good = prev ? (lowerIsBetter ? cur <= prev : cur >= prev) : true;
  return `<span class="font-semibold ${good ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${chgText(cur, prev)}</span>`;
}

let formSave = null;
function openForm(title, fields, onSave, label = 'Save') {
  formSave = onSave;
  $('#mTitle').textContent = title;
  $('#mSave').textContent = label;
  $('#mWarn').innerHTML = '';
  $('#mFields').innerHTML = fields.map(f => {
    const v = f.v ?? '';
    let input;
    if (f.opts) input = `<select name="${f.k}" class="inp mt-1">${f.opts.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.area) input = `<textarea name="${f.k}" rows="3" class="inp mt-1" required>${esc(v)}</textarea>`;
    else input = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}"${f.t === 'number' ? ' min="0" step="any"' : ''} class="inp mt-1" required>`;
    return `<label class="block"><span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${f.l}</span>${input}</label>`;
  }).join('');
  const m = $('#modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  $('#mFields').querySelector('input,select,textarea')?.focus();
}
function closeModal() {
  const m = $('#modal');
  m.classList.add('hidden');
  m.classList.remove('flex');
  formSave = null;
}
$('#mForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!formSave) return;
  const data = Object.fromEntries(new FormData(e.target));
  Object.keys(data).forEach(k => { if (typeof data[k] === 'string') data[k] = data[k].trim(); });
  formSave(data);
  persist();
  closeModal();
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function exportCSV(ym) {
  const rows = [['Date', 'Type', 'Category', 'Description', 'Amount (BDT)']];
  S.orders.filter(o => o.status === 'Delivered' && o.date.startsWith(ym))
    .forEach(o => rows.push([o.date, 'Income', 'Sales', `${orderNo(o)} – ${o.customer}`, o.total]));
  S.ledger.filter(l => l.date.startsWith(ym))
    .forEach(l => rows.push([l.date, l.type, l.cat, l.desc, l.amt]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `bizdesk-${ym}.csv` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('CSV downloaded');
}

const tipCard = t => {
  const KIND = { cost: ['Cut cost', 'bg-rose-100 text-rose-800 dark:bg-rose-500/20 dark:text-rose-300'], grow: ['Grow', 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300'], protect: ['Protect', 'bg-sky-100 text-sky-800 dark:bg-sky-500/20 dark:text-sky-300'] };
  const LV = { high: 'border-l-rose-500', med: 'border-l-amber-500', ok: 'border-l-emerald-500' };
  return `<div class="card p-4 border-l-4 ${LV[t.lv]} overflow-hidden">
    <div class="flex items-start justify-between gap-2 mb-1.5 flex-wrap">
      <h3 class="font-bold text-sm sm:text-base break-words min-w-0">${esc(t.t)}</h3>
      <span class="badge ${KIND[t.k][1]}">${KIND[t.k][0]}</span>
    </div>
    <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed break-words">${esc(t.b)}</p>
    ${t.impact ? `<div class="mt-3 text-xs font-semibold text-brand-700 dark:text-brand-400 break-words">→ ${esc(t.impact)}</div>` : ''}
  </div>`;
};

const scoreText = s => s >= 75 ? 'text-emerald-600 dark:text-emerald-400' : s >= 50 ? 'text-amber-600 dark:text-amber-400' : 'text-rose-600 dark:text-rose-400';

function simOut() {
  const A = summary(null), s = UI.sim;
  const projected = A.sales * (1 + s.up / 100) + A.otherInc - A.expenses * (1 - s.cut / 100);
  const diff = projected - A.profit;
  return `<div class="grid grid-cols-3 gap-2 text-center">
    <div class="p-3 rounded-lg bg-slate-100 dark:bg-slate-800 min-w-0"><div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">Current profit</div><div class="font-bold text-sm sm:text-lg break-words">${money(A.profit)}</div></div>
    <div class="p-3 rounded-lg bg-brand-50 dark:bg-brand-900/40 min-w-0"><div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">Projected</div><div class="font-bold text-sm sm:text-lg break-words">${money(projected)}</div></div>
    <div class="p-3 rounded-lg bg-slate-100 dark:bg-slate-800 min-w-0"><div class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate">Change</div><div class="font-bold text-sm sm:text-lg break-words ${diff >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${diff >= 0 ? '+' : ''}${money(diff)}</div></div>
  </div>`;
}

const simBox = () => `<div class="card p-4 sm:p-5 mt-4 overflow-hidden">
  <div class="font-bold mb-1">What-if simulator</div>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">See how cutting costs or growing sales would change your profit.</p>

    <label class="block"><div class="flex justify-between text-sm"><span>Grow sales by</span><b id="upV">${UI.sim.up}%</b></div>

      <div class="card p-4 overflow-hidden">
        <div class="font-semibold mb-3">Top products this month</div>
        ${cur.units.length ? cur.units.slice(0, 5).map(u => `<div class="flex justify-between gap-2 text-sm py-2 border-t first:border-0 border-slate-100 dark:border-slate-800"><span class="truncate">${esc(u.name)}</span><span class="shrink-0 font-semibold">${u.units} units${u.p ? ` · est. ${money(u.units * u.p.sell)}` : ''}</span></div>`).join('') : emptyNote('No delivered sales this month.')}
      </div>
    </div>
    <div class="card p-4 mt-4 overflow-hidden">
      <div class="font-semibold mb-3">Orders by status</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${statusCounts}</div>
    </div>`;
};

V.advisor = () => {
  const R = analyze(), A = R.A;
  const barCls = R.score >= 75 ? 'bg-emerald-500' : R.score >= 50 ? 'bg-amber-500' : 'bg-rose-500';
  return head('AI business advisor & cost insights', `<button class="btn btn-ghost" onclick="go('reports')">Monthly report</button>`) +
    `<p class="text-sm text-slate-500 dark:text-slate-400 -mt-2 mb-4">Reads your sales, expenses, stock and orders to suggest what to cut and what to grow. It updates automatically as your data changes.</p>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-4">
      <div class="card p-4 flex flex-col gap-2 min-w-0 overflow-hidden">
        <div class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Business health score</div>
        <div class="flex items-end gap-2 flex-wrap"><span class="text-4xl font-extrabold ${scoreText(R.score)}">${R.score}</span><span class="text-sm text-slate-500 dark:text-slate-400 mb-1">/ 100 · ${R.label}</span></div>
        <div class="h-2 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full ${barCls}" style="width:${R.score}%"></div></div>
      </div>
      ${stat('Potential savings', money(R.save), 'Estimated from cost tips', 'text-emerald-600 dark:text-emerald-400')}
      ${stat('Profit margin', pct(A.margin) + '%', 'Net profit ÷ total income', A.margin >= 0.1 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}
    </div>
    <div class="grid md:grid-cols-2 gap-3 sm:gap-4">${R.tips.map(tipCard).join('')}</div>` +
    simBox();
};

/* =========================================================
   10. NAVIGATION & RENDER
   ========================================================= */
const TABS = [
  ['dashboard', '📊', 'Dashboard'],
  ['orders', '📦', 'Orders'],
  ['inventory', '🏷️', 'Inventory'],
  ['hr', '👥', 'HR & Payroll'],
  ['marketing', '📣', 'Marketing'],
  ['finance', '💰', 'Expenses & Ledger'],
  ['reports', '📑', 'Monthly Report'],
  ['advisor', '🤖', 'AI Advisor']
];

let TAB = 'dashboard';
try { const t = localStorage.getItem(TAB_KEY); if (t && V[t]) TAB = t; } catch (e) {}

function go(t) {
  TAB = t;
  try { localStorage.setItem(TAB_KEY, t); } catch (e) {}
  render({ anim: true });
  window.scrollTo(0, 0);
}

function render(o = {}) {
  if (!V[TAB]) TAB = 'dashboard';
  $('#view').innerHTML = `<div class="${o.anim ? 'tab-in' : ''}">${V[TAB]()}</div>`;

  const label = TABS.find(t => t[0] === TAB)[2];
  $('#pageTitle').textContent = label;
  document.title = `${label} · BizDesk`;

  $('#sideNav').innerHTML = TABS.map(([k, ic, l]) => `<button onclick="go('${k}')" aria-current="${k === TAB ? 'page' : 'false'}"
    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-left transition-colors ${k === TAB ? 'bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-100' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
    <span aria-hidden="true">${ic}</span>${l}</button>`).join('');

  $('#topNav').innerHTML = TABS.map(([k, ic, l]) => `<button onclick="go('${k}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${k === TAB ? 'bg-brand-700 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${ic} ${l}</button>`).join('');

  if (o.focus) {
    const el = $(o.focus);
    if (el) { el.focus(); el.setSelectionRange?.(el.value.length, el.value.length); }
  }
}

/* Start the app */
paintTheme();
persist();
render({ anim: true });
</script>
</body>
</html>
