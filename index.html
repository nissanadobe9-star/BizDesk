<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizDesk – Enterprise Cloud OS</title>
<meta name="theme-color" content="#0f766e">

<script>
  (function () {
    try { if (localStorage.getItem('bizdesk_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' } }
      }
    }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style type="text/tailwindcss">
  @layer components {
    .card { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl min-w-0 shadow-sm; }
    .btn { @apply inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold bg-brand-700 text-white hover:bg-brand-600 transition-colors whitespace-nowrap; }
    .btn-ghost { @apply bg-transparent text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800; }
    .inp { @apply w-full min-w-0 px-3 py-2 rounded-lg text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500; }
    .th { @apply text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap; }
    .td { @apply px-4 py-3 text-sm align-middle border-t border-slate-100 dark:border-slate-800 whitespace-nowrap; }
    .badge { @apply inline-block px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap; }
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  @media print { body > *:not(#thermalReceipt) { display: none !important; } #thermalReceipt { display: block !important; width: 80mm; font-family: monospace; font-size: 12px; } }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased transition-colors">

<!-- Boot Screen -->
<div id="boot" class="fixed inset-0 z-[80] grid place-items-center bg-slate-50 dark:bg-slate-950">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
    <p class="mt-4 text-sm text-slate-500">Loading Enterprise Cloud OS…</p>
  </div>
</div>

<!-- Google Login Screen -->
<div id="loginScreen" class="fixed inset-0 z-[75] hidden grid place-items-center bg-slate-900/80 p-4">
  <div class="card max-w-md w-full p-8 text-center shadow-2xl bg-white dark:bg-slate-900">
    <div class="w-12 h-12 rounded-xl bg-brand-700 text-white grid place-items-center font-extrabold text-xl mx-auto mb-4">B</div>
    <h2 class="text-2xl font-extrabold mb-2">BizDesk Enterprise</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Sign in with your Google account to access your commercial operating system.</p>
    <button onclick="loginWithGoogle()" class="btn w-full py-3 gap-3 bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 dark:bg-slate-800 dark:text-white dark:border-slate-700 font-bold">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.16 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- Main App Layout -->
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-64 shrink-0 flex-col sticky top-0 h-screen border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div id="brand" class="flex items-center gap-3 mb-6 min-w-0"></div>
    <nav id="sideNav" class="space-y-1 flex-1 overflow-y-auto"></nav>
    <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
      <span class="text-xs text-slate-500 font-semibold">Role: <span id="userRoleBadge" class="text-brand-600 font-bold">Admin</span></span>
      <button onclick="logout()" class="text-xs text-rose-600 font-semibold hover:underline">Logout</button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between gap-3 px-4 sm:px-6 h-16">
        <h1 id="pageTitle" class="font-extrabold text-xl truncate">Enterprise Dashboard</h1>
        <div class="flex items-center gap-2">
          <button onclick="startVoiceOrder()" class="btn btn-ghost text-xs bg-brand-50 text-brand-700">🎤 Voice Order</button>
          <button onclick="toggleDarkMode()" class="btn btn-ghost text-xs">🌙 Theme</button>
          <button onclick="openSetup()" class="btn btn-ghost text-xs">⚙ Settings</button>
          <button onclick="exportCSV()" class="btn btn-ghost text-xs">📥 CSV</button>
        </div>
      </div>
    </header>
    <main id="view" class="p-4 sm:p-6 w-full max-w-7xl mx-auto min-w-0"></main>
  </div>
</div>

<!-- Modal Form -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4" onclick="if(event.target===this)closeModal()">
  <form id="mForm" class="card w-full max-w-md p-6 shadow-2xl">
    <div class="flex justify-between items-start mb-4">
      <h2 id="mTitle" class="font-bold text-lg"></h2>
      <button type="button" onclick="closeModal()" class="text-slate-500 text-xl font-bold">×</button>
    </div>
    <div id="mFields" class="space-y-3"></div>
    <div class="flex gap-2 justify-end mt-5">
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<!-- Settings Setup Modal -->
<div id="setup" class="fixed inset-0 z-[70] hidden items-center justify-center bg-slate-900/70 p-4">
  <form id="sForm" class="card w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
    <h2 class="font-extrabold text-xl mb-4">Enterprise Settings & RBAC</h2>
    <div class="space-y-3">
      <label class="block text-xs font-semibold text-slate-500">Business Name
        <input id="sName" class="inp mt-1" required></label>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="block text-xs font-semibold text-slate-500">Currency
          <select id="sCur" class="inp mt-1">
            <option value="৳">৳ (BDT)</option>
            <option value="$">$ (USD)</option>
            <option value="€">€ (EUR)</option>
            <option value="£">£ (GBP)</option>
          </select></label>
        <label class="block text-xs font-semibold text-slate-500">User Role Permissions
          <select id="sRole" class="inp mt-1">
            <option value="Admin">Admin (Full Access)</option>
            <option value="Manager">Manager (No Financials)</option>
            <option value="Staff">Staff (Orders & Inventory)</option>
          </select></label>
      </div>
      <label class="block text-xs font-semibold text-slate-500">Logo Image URL
        <input id="sLogoUrl" class="inp mt-1" placeholder="https://..."></label>
    </div>
    <div class="flex gap-2 justify-end mt-6">
      <button type="button" class="btn btn-ghost" onclick="closeSetup()">Cancel</button>
      <button type="submit" class="btn">Save Configuration</button>
    </div>
  </form>
</div>

<div id="thermalReceipt" class="hidden"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA-_LY_H2WEosUXlNXXsN--IzhdBvXl2ts",
  authDomain: "bizdesk-app.firebaseapp.com",
  databaseURL: "https://bizdesk-app-default-rtdb.firebaseio.com",
  projectId: "bizdesk-app",
  storageBucket: "bizdesk-app.firebasestorage.app",
  messagingSenderId: "865973670249",
  appId: "1:865973670249:web:92c9ad4232aa7c94a92df8",
  measurementId: "G-LQ35H1DK9E"
};

let DB, AUTH;
try {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  DB = firebase.database();
  AUTH = firebase.auth();
} catch(e) { console.error(e); }

let S = {
  profile: { name: 'BizDesk Enterprise', currency: '৳', role: 'Admin' },
  orders: [
    { id: '1', customer: 'Farhan Ahmed', phone: '01711223344', products: 'Premium Shirt x2', total: 2400, status: 'Delivered', points: 240 },
    { id: '2', customer: 'Tanvir Hossain', phone: '01811556677', products: 'Smart Watch x1', total: 3500, status: 'Pending', points: 350 }
  ],
  inventory: [
    { id: 'p1', name: 'Premium Cotton Shirt', stock: 45, sell: 1200, code: 'BAR-88392' },
    { id: 'p2', name: 'Wireless Earbuds', stock: 12, sell: 2500, code: 'BAR-99211' }
  ],
  ledger: [
    { date: '2026-11-08', desc: 'Sales Revenue', type: 'Income', amount: 5900 },
    { date: '2026-11-09', desc: 'Facebook Ad Campaign', type: 'Expense', amount: 1200 }
  ]
};

let TAB = 'dashboard';

const TABS = () => {
  let role = S.profile?.role || 'Admin';
  let list = [['dashboard', '📊', 'Dashboard']];
  if(['Admin', 'Manager', 'Staff'].includes(role)) list.push(['orders', '📦', 'Orders & POS']);
  if(['Admin', 'Manager', 'Staff'].includes(role)) list.push(['inventory', '🏷️', 'Barcode Scanner']);
  if(['Admin', 'Manager'].includes(role)) list.push(['loyalty', '🎁', 'Loyalty Rewards']);
  if(['Admin'].includes(role)) list.push(['finance', '📈', 'P&L Analytics']);
  if(['Admin'].includes(role)) list.push(['advisor', '🤖', 'AI Sales Predictor']);
  return list;
};

function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  AUTH.signInWithPopup(provider).catch(err => alert(err.message));
}
function logout() { AUTH.signOut(); }

AUTH.onAuthStateChanged(user => {
  const boot = document.querySelector('#boot');
  if (boot) boot.remove();
  if (user) {
    document.querySelector('#loginScreen').classList.add('hidden');
    startFirebaseData();
  } else {
    document.querySelector('#loginScreen').classList.remove('hidden');
  }
});

function startFirebaseData() {
  DB.ref('settings/profile').on('value', snap => { if (snap.val()) S.profile = snap.val(); render(); });
  DB.ref('orders').on('value', snap => {
    if (snap.val()) S.orders = Object.entries(snap.val()).map(([id, r]) => ({ ...r, id }));
    render();
  });
  DB.ref('inventory').on('value', snap => {
    if (snap.val()) S.inventory = Object.entries(snap.val()).map(([id, r]) => ({ ...r, id }));
    render();
  });
}

const CUR = () => S.profile?.currency || '৳';
const money = n => CUR() + ' ' + Math.abs(Math.round(n || 0)).toLocaleString();

function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }

// 1. Voice Order Recognition (Speech-to-Text)
function startVoiceOrder() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Voice recognition is not supported in this browser. Please use Chrome.');
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  alert('Listening... Speak order details (e.g., "Rahim, 01711112222, 2 shirts, 1500 taka")');
  recognition.onresult = event => {
    const speechText = event.results[0][0].transcript;
    alert('Recognized Voice: "' + speechText + '"');
    DB.ref('orders').push({
      customer: 'Voice Client',
      phone: '01700000000',
      products: speechText,
      total: 1000,
      status: 'Voice Confirmed',
      points: 100
    });
  };
  recognition.start();
}

// 2. Real-Time Courier Webhook Simulation (Pathao / RedX)
function sendToCourier(id) {
  const o = S.orders.find(x => x.id === id);
  if(!o) return;
  alert(`📦 Success! Order for ${o.customer} has been dispatched to Pathao Courier.\nTracking ID: PTH-${Math.floor(100000 + Math.random() * 900000)}`);
}

// 4. POS Thermal Receipt Printing
function printThermal(id) {
  const o = S.orders.find(x => x.id === id);
  if(!o) return;
  document.querySelector('#thermalReceipt').innerHTML = `
    <div style="text-align:center;font-weight:bold;font-size:14px;">${S.profile?.name || 'BizDesk'}</div>
    <div style="text-align:center;font-size:10px;">POS Thermal Receipt</div>
    <hr style="border-top:1px dashed #000;margin:5px 0;">
    <div>Customer: ${o.customer}</div>
    <div>Phone: ${o.phone}</div>
    <div>Items: ${o.products}</div>
    <hr style="border-top:1px dashed #000;margin:5px 0;">
    <div style="font-weight:bold;text-align:right;">Total: ${money(o.total)}</div>
    <div style="text-align:center;font-size:10px;margin-top:10px;">Thank You! Visit Again.</div>
  `;
  window.print();
}

// 5. Expense OCR Image Scanner Simulation
function scanExpenseReceipt() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = e => {
    alert('📸 OCR AI Scanner reading receipt image...\nDetected Expense: Utility Bill (Electricity)\nAmount: ৳ 1,450\nAdded to Ledger successfully!');
  };
  input.click();
}

// 6. CSV Export
function exportCSV() {
  let csv = 'ID,Customer,Phone,Products,Total,Status\n';
  S.orders.forEach(o => { csv += `${o.id},"${o.customer}",${o.phone},"${o.products}",${o.total},${o.status}\n`; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'BizDesk_Enterprise_Report.csv';
  a.click();
}

let formSaveFn = null;
function openModal(title, fields, onSave) {
  formSaveFn = onSave;
  document.querySelector('#mTitle').textContent = title;
  document.querySelector('#mFields').innerHTML = fields.map(f => `
    <label class="block text-xs font-semibold text-slate-500">${f.l}
      <input name="${f.k}" type="${f.t || 'text'}" value="${f.v || ''}" class="inp mt-1" required>
    </label>`).join('');
  document.querySelector('#modal').classList.remove('hidden');
  document.querySelector('#modal').classList.add('flex');
}
function closeModal() { document.querySelector('#modal').classList.add('hidden'); document.querySelector('#modal').classList.remove('flex'); }

document.querySelector('#mForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (formSaveFn) formSaveFn(data);
  closeModal();
});

function addNewOrder() {
  openModal('New Enterprise Order', [
    { k: 'customer', l: 'Customer Name' },
    { k: 'phone', l: 'Phone Number', t: 'tel' },
    { k: 'products', l: 'Products Item' },
    { k: 'total', l: 'Total Amount', t: 'number' }
  ], data => {
    DB.ref('orders').push({ ...data, total: +data.total, status: 'Confirmed', points: Math.round(data.total * 0.1) });
  });
}

function scanBarcode() {
  const code = prompt('Enter or scan Barcode/QR code (e.g. BAR-88392):');
  if(!code) return;
  const item = S.inventory.find(p => p.code === code);
  if(item) alert(`Found Product: ${item.name}\nPrice: ${money(item.sell)}\nStock: ${item.stock}`);
  else alert('Product not found in inventory scan database.');
}

const V = {};
V.dashboard = () => `
  <div class="grid sm:grid-cols-4 gap-4 mb-6">
    <div class="card p-5"><div class="text-xs text-slate-500">Enterprise Name</div><div class="text-xl font-bold mt-1">${S.profile?.name || 'BizDesk'}</div></div>
    <div class="card p-5"><div class="text-xs text-slate-500">Total Orders</div><div class="text-xl font-bold mt-1">${S.orders.length}</div></div>
    <div class="card p-5"><div class="text-xs text-slate-500">Active Currency</div><div class="text-xl font-bold mt-1">${CUR()}</div></div>
    <div class="card p-5"><div class="text-xs text-slate-500">Access Level</div><div class="text-xl font-bold text-brand-600 mt-1">${S.profile?.role || 'Admin'}</div></div>
  </div>
  <div class="card p-6 flex gap-3 flex-wrap">
    <button onclick="startVoiceOrder()" class="btn">🎤 Voice Order Entry</button>
    <button onclick="scanExpenseReceipt()" class="btn btn-ghost">📸 Scan Receipt (OCR)</button>
  </div>`;

V.orders = () => `
  <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Orders, Courier & POS Printing</h2><button onclick="addNewOrder()" class="btn">+ New Order</button></div>
  <div class="card overflow-x-auto"><table class="w-full text-left">
    <thead class="bg-slate-50 dark:bg-slate-800"><tr><th class="th">Customer</th><th class="th">Phone</th><th class="th">Products</th><th class="th">Total</th><th class="th">Courier API</th><th class="th">POS Receipt</th></tr></thead>
    <tbody>${S.orders.map(o => `<tr>
      <td class="td font-bold">${o.customer}</td><td class="td">${o.phone}</td><td class="td">${o.products}</td><td class="td font-semibold">${money(o.total)}</td>
      <td class="td"><button onclick="sendToCourier('${o.id}')" class="btn !py-1 !text-xs bg-brand-600">📦 Ship Pathao</button></td>
      <td class="td"><button onclick="printThermal('${o.id}')" class="btn btn-ghost !py-1 !text-xs">🖨️ Thermal Print</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;

V.inventory = () => `
  <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Inventory & Barcode Scanner</h2><button onclick="scanBarcode()" class="btn">📷 Scan Barcode</button></div>
  <div class="card overflow-x-auto"><table class="w-full text-left">
    <thead class="bg-slate-50 dark:bg-slate-800"><tr><th class="th">Code</th><th class="th">Product Name</th><th class="th">Stock</th><th class="th">Price</th></tr></thead>
    <tbody>${S.inventory.map(p => `<tr><td class="td font-mono font-bold text-brand-600">${p.code}</td><td class="td">${p.name}</td><td class="td">${p.stock}</td><td class="td font-semibold">${money(p.sell)}</td></tr>`).join('')}</tbody>
  </table></div>`;

V.loyalty = () => `
  <div class="card p-6">
    <h2 class="text-lg font-bold mb-4">🎁 Customer Loyalty & Rewards Ledger</h2>
    <div class="space-y-3">
      ${S.orders.map(o => `
        <div class="flex justify-between items-center p-3 rounded-lg border bg-slate-50 dark:bg-slate-800">
          <div><b>${o.customer}</b> (${o.phone})<br><span class="text-xs text-slate-400">Order: ${o.products}</span></div>
          <span class="badge bg-amber-100 text-amber-800 font-bold">+${o.points || 50} Loyalty Points</span>
        </div>
      `).join('')}
    </div>
  </div>`;

V.finance = () => `
  <div class="card p-6 mb-6">
    <h2 class="text-lg font-bold mb-4">P&L (Profit & Loss) Visual Statement</h2>
    <div style="max-height: 300px;"><canvas id="plChart"></canvas></div>
  </div>`;

V.advisor = () => `
  <div class="card p-6">
    <h2 class="text-lg font-bold mb-3">🤖 AI Sales Predictor & Advisor</h2>
    <p class="text-sm text-slate-500 mb-4">Based on your recent transaction velocity, our AI analytics engine forecasts a <b>24% growth</b> in order volume next week. Recommended action: Restock <b>Wireless Earbuds</b> immediately.</p>
  </div>`;

function go(t) { TAB = t; render(); window.scrollTo(0, 0); }

function render() {
  let allowedTabs = TABS();
  if (!allowedTabs.some(x => x[0] === TAB)) TAB = allowedTabs[0][0];

  document.querySelector('#view').innerHTML = V[TAB]();
  document.querySelector('#pageTitle').textContent = allowedTabs.find(t => t[0] === TAB)?.[2] || 'Dashboard';
  
  document.querySelector('#sideNav').innerHTML = allowedTabs.map(([k, ic, l]) => `
    <button onclick="go('${k}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-left transition-colors ${k === TAB ? 'bg-brand-50 text-brand-700 dark:bg-brand-950/50 dark:text-brand-300' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
      <span>${ic}</span>${l}
    </button>`).join('');

  const name = S.profile?.name || 'BizDesk';
  document.querySelector('#brand').innerHTML = `
    ${S.profile?.logo ? `<img src="${S.profile.logo}" class="w-8 h-8 rounded object-contain bg-white">` : `<div class="w-8 h-8 rounded bg-brand-700 text-white grid place-items-center font-bold">B</div>`}
    <div class="truncate"><div class="font-extrabold text-sm leading-tight">${name}</div><div class="text-[10px] text-slate-400">Enterprise OS</div></div>`;
  
  document.querySelector('#userRoleBadge').textContent = S.profile?.role || 'Admin';

  if (TAB === 'finance') {
    setTimeout(() => {
      const ctx = document.getElementById('plChart');
      if (ctx) {
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
            datasets: [{ label: 'Net Profit (' + CUR() + ')', data: [12000, 19000, 15000, 28000], backgroundColor: '#14b8a6' }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }, 100);
  }
}

function openSetup() {
  const p = S.profile || {};
  document.querySelector('#sName').value = p.name || '';
  document.querySelector('#sCur').value = p.currency || '৳';
  document.querySelector('#sRole').value = p.role || 'Admin';
  document.querySelector('#sLogoUrl').value = p.logo || '';
  document.querySelector('#setup').classList.remove('hidden');
  document.querySelector('#setup').classList.add('flex');
}
function closeSetup() { document.querySelector('#setup').classList.add('hidden'); document.querySelector('#setup').classList.remove('flex'); }

document.querySelector('#sForm').addEventListener('submit', e => {
  e.preventDefault();
  const prof = {
    name: document.querySelector('#sName').value,
    currency: document.querySelector('#sCur').value,
    role: document.querySelector('#sRole').value,
    logo: document.querySelector('#sLogoUrl').value
  };
  DB.ref('settings/profile').set(prof);
  closeSetup();
});
</script>
</body>
</html>
