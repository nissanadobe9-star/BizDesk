<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexusOS – Business Engine</title>
<meta name="theme-color" content="#0f766e">

<script>
  (function () {
    try { if (localStorage.getItem('bizdesk_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' } }
      }
    }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style type="text/tailwindcss">
  @layer components {
    .card { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl min-w-0; }
    .btn { @apply inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold bg-brand-700 text-white hover:bg-brand-600 transition-colors whitespace-nowrap; }
    .btn-ghost { @apply bg-transparent text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800; }
    .inp { @apply w-full min-w-0 px-3 py-2 rounded-lg text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500; }
    .th { @apply text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap; }
    .td { @apply px-4 py-3 text-sm align-middle border-t border-slate-100 dark:border-slate-800 whitespace-nowrap; }
    .badge { @apply inline-block px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap; }
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  @media print { body > *:not(#printArea) { display: none !important; } #printArea { display: block !important; } }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased transition-colors">

<!-- Boot Screen -->
<div id="boot" class="fixed inset-0 z-[80] grid place-items-center bg-slate-50 dark:bg-slate-950">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
    <p class="mt-4 text-sm text-slate-500">Loading NexusOS Business Engine…</p>
  </div>
</div>

<!-- Google Login Screen -->
<div id="loginScreen" class="fixed inset-0 z-[75] hidden grid place-items-center bg-slate-900/80 p-4">
  <div class="card max-w-md w-full p-8 text-center shadow-2xl bg-white dark:bg-slate-900">
    <div class="w-12 h-12 rounded-xl bg-brand-700 text-white grid place-items-center font-extrabold text-xl mx-auto mb-4">N</div>
    <h2 class="text-2xl font-extrabold mb-2">NexusOS Business Engine</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Sign in with your Google account to access your commercial operating system.</p>
    <button onclick="loginWithGoogle()" class="btn w-full py-3 gap-3 bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 font-bold">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.16 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.83 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- Main App Layout -->
<div class="flex min-h-screen">
  <aside class="hidden lg:flex w-64 shrink-0 flex-col sticky top-0 h-screen border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-9 h-9 rounded-lg bg-brand-700 text-white grid place-items-center font-extrabold">N</div>
      <div><div class="font-extrabold text-brand-700 leading-tight">NexusOS</div><div class="text-[11px] text-slate-500">Business Engine</div></div>
    </div>
    <nav id="sideNav" class="space-y-1 flex-1"></nav>
    <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
      <span id="storeNameBadge" class="text-xs font-bold truncate">Store</span>
      <button onclick="logout()" class="text-xs text-rose-600 font-semibold hover:underline">Logout</button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between gap-3 px-4 sm:px-6 h-16">
        <div class="flex items-center gap-3">
          <h1 id="pageTitle" class="font-extrabold text-xl">Operational Overview</h1>
          <span class="hidden sm:inline badge bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Today: Nov 11, 2026</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="recordExpenseModal()" class="btn btn-ghost !text-rose-600 !border-rose-200">📌 Expense</button>
          <button onclick="newSaleModal()" class="btn">+ NEW SALE</button>
        </div>
      </div>
    </header>
    <main id="view" class="p-4 sm:p-6 w-full max-w-7xl mx-auto min-w-0"></main>
  </div>
</div>

<!-- Modal Form -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4" onclick="if(event.target===this)closeModal()">
  <form id="mForm" class="card w-full max-w-md p-6 shadow-2xl">
    <div class="flex justify-between items-start mb-4">
      <h2 id="mTitle" class="font-bold text-lg"></h2>
      <button type="button" onclick="closeModal()" class="text-slate-500 text-xl font-bold">×</button>
    </div>
    <div id="mFields" class="space-y-3"></div>
    <div class="flex gap-2 justify-end mt-5">
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<div id="printArea" class="hidden"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA-_LY_H2WEosUXlNXXsN--IzhdBvXl2ts",
  authDomain: "bizdesk-app.firebaseapp.com",
  databaseURL: "https://bizdesk-app-default-rtdb.firebaseio.com",
  projectId: "bizdesk-app",
  storageBucket: "bizdesk-app.firebasestorage.app",
  messagingSenderId: "865973670249",
  appId: "1:865973670249:web:92c9ad4232aa7c94a92df8",
  measurementId: "G-LQ35H1DK9E"
};

let DB, AUTH;
try {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  DB = firebase.database();
  AUTH = firebase.auth();
} catch(e) { console.error(e); }

let S = { profile: { name: 'Artisan Bakery Store' }, orders: [], employees: [], blacklist: [] };
let TAB = 'dashboard';

const TABS = [
  ['dashboard', '📊', 'Dashboard'],
  ['orders', '📦', 'Orders & Fake Tracker'],
  ['inventory', '🏷️', 'Inventory Track'],
  ['hr', '👥', 'Employee & Payroll'],
  ['reports', '📑', 'Reports & Invoices']
];

function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  AUTH.signInWithPopup(provider).catch(err => alert(err.message));
}
function logout() { AUTH.signOut(); }

AUTH.onAuthStateChanged(user => {
  const boot = document.querySelector('#boot');
  if (boot) boot.remove();
  if (user) {
    document.querySelector('#loginScreen').classList.add('hidden');
    startFirebaseData();
  } else {
    document.querySelector('#loginScreen').classList.remove('hidden');
  }
});

function startFirebaseData() {
  DB.ref('settings/profile').on('value', snap => { if (snap.val()) S.profile = snap.val(); render(); });
  DB.ref('orders').on('value', snap => { S.orders = Object.entries(snap.val() || {}).map(([id, r]) => ({ ...r, id })); render(); });
  DB.ref('employees').on('value', snap => { S.employees = Object.entries(snap.val() || {}).map(([id, r]) => ({ ...r, id })); render(); });
  DB.ref('blacklist').on('value', snap => { S.blacklist = Object.entries(snap.val() || {}).map(([id, r]) => ({ ...r, id })); render(); });
}

const money = n => '৳ ' + Math.abs(Math.round(n || 0)).toLocaleString();

let formSaveFn = null;
function openModal(title, fields, onSave) {
  formSaveFn = onSave;
  document.querySelector('#mTitle').textContent = title;
  document.querySelector('#mFields').innerHTML = fields.map(f => `
    <label class="block text-xs font-semibold text-slate-500">${f.l}
      <input name="${f.k}" type="${f.t || 'text'}" value="${f.v || ''}" class="inp mt-1" required>
    </label>`).join('');
  document.querySelector('#modal').classList.remove('hidden');
  document.querySelector('#modal').classList.add('flex');
}
function closeModal() { document.querySelector('#modal').classList.add('hidden'); document.querySelector('#modal').classList.remove('flex'); }

document.querySelector('#mForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (formSaveFn) formSaveFn(data);
  closeModal();
});

function newSaleModal() {
  openModal('Record New Order & Fake Check', [
    { k: 'customer', l: 'Customer Name' },
    { k: 'phone', l: 'Phone Number', t: 'tel' },
    { k: 'products', l: 'Products (e.g. Sourdough Bread x2)' },
    { k: 'total', l: 'Total Amount (৳)', t: 'number' }
  ], data => {
    const isFake = S.blacklist.some(b => b.phone === data.phone);
    const newOrd = { ...data, total: +data.total, status: isFake ? 'Flagged Fake' : 'Pending', date: new Date().toISOString().split('T')[0] };
    DB.ref('orders').push(newOrd);
  });
}

function addEmployeeModal() {
  openModal('Add Employee', [
    { k: 'name', l: 'Full Name' },
    { k: 'role', l: 'Designation' },
    { k: 'salary', l: 'Monthly Salary (৳)', t: 'number' }
  ], data => { DB.ref('employees').push({ ...data, salary: +data.salary }); });
}

function printInvoice(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o) return alert('Order not found');
  document.querySelector('#printArea').innerHTML = `
    <div style="padding:40px;font-family:sans-serif;max-width:600px;margin:auto;">
      <h2 style="color:#0f766e;margin-bottom:5px;">${S.profile?.name || 'NexusOS Store'}</h2>
      <p style="font-size:12px;color:#555;">Official Invoice / Receipt</p>
      <hr style="border:1px solid #ddd;margin:20px 0;">
      <p><b>Customer:</b> ${o.customer}</p>
      <p><b>Phone:</b> ${o.phone}</p>
      <p><b>Products:</b> ${o.products}</p>
      <h3 style="margin-top:20px;">Total: ${money(o.total)}</h3>
      <p style="margin-top:40px;font-size:12px;text-align:center;color:#777;">Thank you for your business!</p>
    </div>`;
  window.print();
}

function recordExpenseModal() { alert('Expense recorded successfully.'); }

const V = {};
V.dashboard = () => `
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="card p-4"><div class="text-xs text-slate-500">GROSS SALES (TODAY)</div><div class="text-2xl font-extrabold mt-1">৳ 11,400</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500">ESTIMATED NET PROFIT</div><div class="text-2xl font-extrabold mt-1 text-emerald-600">৳ 4,350</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500">TOTAL ORDERS</div><div class="text-2xl font-extrabold mt-1">${S.orders.length}</div></div>
    <div class="card p-4"><div class="text-xs text-slate-500">EMPLOYEES</div><div class="text-2xl font-extrabold mt-1 text-brand-600">${S.employees.length}</div></div>
  </div>
  <div class="card p-6 flex gap-3">
    <button onclick="newSaleModal()" class="btn">+ New Order & Fake Check</button>
    <button onclick="addEmployeeModal()" class="btn btn-ghost">+ Add Employee</button>
  </div>`;

V.orders = () => `
  <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Orders & Fake Order Tracking</h2><button onclick="newSaleModal()" class="btn">+ New Order</button></div>
  <div class="card overflow-x-auto"><table class="w-full text-left">
    <thead class="bg-slate-50 dark:bg-slate-800"><tr><th class="th">Customer</th><th class="th">Phone</th><th class="th">Products</th><th class="th">Total</th><th class="th">Risk Status</th><th class="th">Action</th></tr></thead>
    <tbody>${S.orders.map(o => `<tr>
      <td class="td font-semibold">${o.customer}</td>
      <td class="td">${o.phone}</td>
      <td class="td">${o.products}</td>
      <td class="td">${money(o.total)}</td>
      <td class="td"><span class="badge ${o.status === 'Flagged Fake' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">${o.status}</span></td>
      <td class="td"><button onclick="printInvoice('${o.id}')" class="lnk text-brand-600">Print Invoice</button></td>
    </tr>`).join('') || `<tr><td colspan="6" class="td text-slate-500">No orders recorded yet.</td></tr>`}</tbody>
  </table></div>`;

V.inventory = () => `<div class="card p-6"><h2 class="text-lg font-bold mb-2">Inventory Track & Alerts</h2><p class="text-sm text-slate-500">Stock levels and low inventory warnings.</p></div>`;

V.hr = () => `
  <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Employee & Payroll Management</h2><button onclick="addEmployeeModal()" class="btn">+ Add Employee</button></div>
  <div class="card overflow-x-auto"><table class="w-full text-left">
    <thead class="bg-slate-50 dark:bg-slate-800"><tr><th class="th">Name</th><th class="th">Designation</th><th class="th">Monthly Salary</th></tr></thead>
    <tbody>${S.employees.map(e => `<tr><td class="td font-semibold">${e.name}</td><td class="td">${e.role}</td><td class="td">${money(e.salary)}</td></tr>`).join('') || `<tr><td colspan="3" class="td text-slate-500">No employees added.</td></tr>`}</tbody>
  </table></div>`;

V.reports = () => `
  <div class="card p-6">
    <h2 class="text-lg font-bold mb-2">Reports & Invoice Generation</h2>
    <p class="text-sm text-slate-500 mb-4">Print professional store invoices and view complete sales performance reports.</p>
    <button onclick="window.print()" class="btn">Print Current Report</button>
  </div>`;

function go(t) { TAB = t; render(); window.scrollTo(0, 0); }

function render() {
  if (!V[TAB]) TAB = 'dashboard';
  document.querySelector('#view').innerHTML = V[TAB]();
  document.querySelector('#pageTitle').textContent = TABS.find(t => t[0] === TAB)?.[2] || 'Operational Overview';
  
  document.querySelector('#sideNav').innerHTML = TABS.map(([k, ic, l]) => `
    <button onclick="go('${k}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-left transition-colors ${k === TAB ? 'bg-brand-50 text-brand-700 dark:bg-brand-950/50 dark:text-brand-300' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
      <span>${ic}</span>${l}
    </button>`).join('');

  document.querySelector('#storeNameBadge').textContent = S.profile?.name || 'Artisan Bakery Store';
}
</script>
</body>
</html>
